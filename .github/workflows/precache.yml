name: Overpass Cache Warmup

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Warm cache for popular regions
        env:
          API: https://hhonilnfkmqppcsrwzbk.supabase.co/functions/v1/api/overpass
        run: |
          # 27 popular German camping regions
          REGIONS=(
            "Berlin,52.30,13.20,52.70,13.80"
            "Hamburg,53.40,9.80,53.70,10.20"
            "München,48.00,11.30,48.30,11.80"
            "Köln,50.80,6.80,51.10,7.20"
            "Frankfurt,49.90,8.50,50.20,8.90"
            "Stuttgart,48.70,9.00,48.90,9.30"
            "Düsseldorf,51.10,6.70,51.30,7.00"
            "Leipzig,51.20,12.20,51.50,12.60"
            "Dresden,50.90,13.60,51.20,14.00"
            "Nürnberg,49.30,10.90,49.60,11.20"
            "Hannover,52.30,9.60,52.50,9.90"
            "Bremen,53.00,8.70,53.20,9.00"
            "Bodensee,47.50,9.20,47.80,9.80"
            "Rügen,54.30,13.30,54.70,13.80"
            "Usedom,53.80,13.90,54.20,14.30"
            "Sylt,54.80,8.20,55.10,8.60"
            "Cuxhaven,53.80,8.50,54.00,9.00"
            "Schwarzwald_Süd,47.70,7.80,48.00,8.30"
            "Schwarzwald_Nord,48.40,8.00,48.80,8.40"
            "Bayerische_Alpen,47.30,10.80,47.70,11.20"
            "Harz,51.60,10.50,51.90,11.00"
            "Sächsische_Schweiz,50.80,13.90,51.00,14.40"
            "Mecklenburg_Seenplatte,53.20,12.50,53.60,13.00"
            "Allgäu,47.40,9.80,47.80,10.40"
            "Eifel,50.10,6.30,50.50,6.90"
            "Mosel,49.80,6.80,50.00,7.30"
            "Sauerland,51.00,7.70,51.40,8.50"
          )

          ok=0 fail=0

          for region in "${REGIONS[@]}"; do
            IFS=',' read -r name s w n e <<< "$region"
            echo "  → $name ($s,$w,$n,$e)"

            query="[out:json][timeout:30];(node[\"amenity\"=\"parking\"][\"motorhome\"!=\"yes\"]($s,$w,$n,$e);way[\"amenity\"=\"parking\"][\"motorhome\"!=\"yes\"]($s,$w,$n,$e);node[\"tourism\"=\"camp_pitch\"]($s,$w,$n,$e);way[\"tourism\"=\"camp_pitch\"]($s,$w,$n,$e);relation[\"tourism\"=\"camp_pitch\"]($s,$w,$n,$e);node[\"amenity\"=\"parking\"][\"motorhome\"=\"yes\"]($s,$w,$n,$e);way[\"amenity\"=\"parking\"][\"motorhome\"=\"yes\"]($s,$w,$n,$e);node[\"tourism\"=\"caravan_site\"]($s,$w,$n,$e);way[\"tourism\"=\"caravan_site\"]($s,$w,$n,$e);relation[\"tourism\"=\"caravan_site\"]($s,$w,$n,$e);node[\"tourism\"=\"camp_site\"]($s,$w,$n,$e);way[\"tourism\"=\"camp_site\"]($s,$w,$n,$e);relation[\"tourism\"=\"camp_site\"]($s,$w,$n,$e);node[\"amenity\"=\"sanitary_dump_station\"]($s,$w,$n,$e);way[\"amenity\"=\"sanitary_dump_station\"]($s,$w,$n,$e);node[\"amenity\"=\"water_point\"]($s,$w,$n,$e);way[\"amenity\"=\"water_point\"]($s,$w,$n,$e);node[\"sport\"=\"climbing\"]($s,$w,$n,$e);way[\"sport\"=\"climbing\"]($s,$w,$n,$e);relation[\"sport\"=\"climbing\"]($s,$w,$n,$e););out center tags;"

            # NB: plain --data (literal), NOT --data-urlencode. The proxy runs
            # decodeURIComponent on the body; curl's re-encoding doesn't round-trip
            # cleanly and the query fails validation (400). The literal body does.
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 90 \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data "data=$query" \
              "$API" || echo "000")

            if [ "$status" = "200" ]; then
              echo "    ✓ $status"
              ok=$((ok + 1))
            else
              echo "    ✗ $status"
              fail=$((fail + 1))
            fi
          done

          echo ""
          echo "Warmup done: $ok ok, $fail failed"
          [ "$fail" -eq 0 ] || exit 1
