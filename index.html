                border-top: 1px solid var(--border-soft);
            }
            .notes-loading {
                font-size: 0.78rem;
                color: var(--ink-faint);
                font-style: italic;
                padding: 10px 0 0;
            }
            .notes-heading {
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--ink-muted);
                text-transform: uppercase;
                letter-spacing: 0.6px;
                margin: 12px 0 6px;
            }
            .note-item {
                background: #fbf4e4;
                border: 1px solid #e6d6b0;
                border-radius: var(--radius-sm);
                padding: 8px 11px;
                margin-bottom: 6px;
            }
            .note-text {
                font-size: 0.82rem;
                color: var(--ink);
                line-height: 1.45;
            }
            .note-meta {
                font-size: 0.72rem;
                color: var(--ink-faint);
                margin-top: 3px;
            }
            .note-text a {
                color: var(--terracotta);
                word-break: break-all;
            }
            .note-img {
                display: block;
                max-height: 100px;
                max-width: 100%;
                border-radius: var(--radius-sm);
                margin-top: 5px;
                object-fit: cover;
            }

            /* ── Lightbox ── */
            #poi-lightbox {
                position: fixed;
                inset: 0;
                z-index: 2000;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #poi-lightbox.hidden {
                display: none;
            }
            .lightbox-backdrop {
                position: absolute;
                inset: 0;
                background: rgba(28, 25, 21, 0.9);
            }
            .lightbox-close {
                position: absolute;
                top: 14px;
                right: 14px;
                z-index: 1;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: none;
                background: rgba(255, 255, 255, 0.18);
                color: #fff;
                font-size: 1.1rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .lightbox-close:hover {
                background: rgba(255, 255, 255, 0.32);
            }
            .lightbox-img {
                position: relative;
                z-index: 1;
                max-width: 92vw;
                max-height: 88vh;
                border-radius: var(--radius);
                object-fit: contain;
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            }

            /* ── Update banner (new version available) ── */
            .update-banner {
                display: none;
                align-items: center;
                gap: 12px;
                padding: 10px 16px;
                background: var(--accent);
                color: #fff;
                font-size: 0.88rem;
                font-weight: 500;
                flex-shrink: 0;
            }
            .update-banner.visible {
                display: flex;
            }
            .update-banner-text {
                flex: 1;
            }
            .update-banner-btn {
                border: 1.5px solid rgba(255, 255, 255, 0.6);
                border-radius: var(--radius-sm);
                background: transparent;
                color: #fff;
                font-size: 0.82rem;
                font-weight: 600;
                padding: 6px 14px;
                cursor: pointer;
                white-space: nowrap;
            }
            .update-banner-btn:hover {
                background: rgba(255, 255, 255, 0.15);
            }
            .update-banner-close {
                background: none;
                border: none;
                color: #fff;
                cursor: pointer;
                padding: 2px;
                opacity: 0.7;
                display: inline-flex;
                align-items: center;
            }
            .update-banner-close:hover {
                opacity: 1;
            }
            .update-banner-close svg {
                width: 18px;
                height: 18px;
                display: block;
            }

            /* ── SVG icon sizing for inline Lucide icons ── */
            .side-menu-icon svg {
                width: 1.15rem;
                height: 1.15rem;
                display: block;
            }
            .side-menu-divider {
                border: none;
                border-top: 1px solid rgba(0, 0, 0, 0.1);
                margin: 4px 16px;
            }
            .side-menu-section-label {
                display: block;
                padding: 10px 16px 2px;
                font-size: 0.68rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.09em;
                color: var(--ink-muted);
                pointer-events: none;
            }
            .info-legal-note {
                font-size: 0.85rem;
                color: var(--ink-muted);
                margin-top: 16px;
            }
            .side-menu-close svg,
            .fav-close svg,
            .btn-close svg {
                width: 1.1rem;
                height: 1.1rem;
                display: block;
            }
            .fav-title svg {
                width: 1.05rem;
                height: 1.05rem;
                vertical-align: -0.1em;
            }
            .btn-navigate svg {
                width: 1em;
                height: 1em;
                vertical-align: middle;
            }
            .mynote-heading svg,
            .notes-heading svg,
            .nearby-heading svg {
                width: 0.85em;
                height: 0.85em;
                vertical-align: -0.1em;
            }
            .fav-item-remove svg {
                width: 1.05rem;
                height: 1.05rem;
                display: block;
            }
            .profile-row dt svg {
                width: 0.9rem;
                height: 0.9rem;
                vertical-align: -0.1em;
            }
            .fav-item-sub svg {
                width: 0.85em;
                height: 0.85em;
                vertical-align: -0.1em;
            }

            @media (max-width: 600px) {
                /* Hide the app title from the topbar on mobile — it's in the sidebar now. */
                #topbar h1 {
                    display: none;
                }

                /* The detail panel child is fixed on mobile; reset parent so it doesn't
         steal space from the absolutely-positioned map. */
                #detail-panel {
                    position: static;
                    width: auto;
                }

                /* Filter bar stays compact — routing is now on the map. */
                #filter-panel {
                    padding: 8px;
                }

                /* fixed (not absolute): the #detail-panel host collapses to 0 width on
         mobile because its only child is out of flow — anchor to the viewport.
         z-index must beat Leaflet's panes/controls (root stacking context). */
                .poi-detail-panel {
                    position: fixed;
                    bottom: 0;
                    left: 0;
                    right: 0;
                    width: 100%;
                    height: 50dvh;
                    border-left: none;
                    border-top: 1px solid var(--border);
                    border-radius: var(--radius) var(--radius) 0 0;
                    box-shadow: 0 -4px 16px rgba(44, 40, 34, 0.18);
                    z-index: 1100;
                    padding-bottom: env(safe-area-inset-bottom);
                }

                /* Compact header + action footer on mobile so the panel stays
                   short and more of the map remains visible. */
                .poi-detail-panel .panel-header {
                    padding: 12px 16px 8px;
                }
                .poi-detail-panel .panel-actions {
                    padding: 8px 14px calc(-36px + env(safe-area-inset-bottom));
                    gap: 6px;
                }
                .poi-detail-panel .btn-primary {
                    padding: 9px;
                    font-size: 0.85rem;
                }
                /* On mobile the three secondary actions sit side by side; Google
                   Maps loses its full-width row to save vertical space. */
                .poi-detail-panel .panel-actions-grid {
                    grid-template-columns: 1fr 1fr 1fr;
                    gap: 6px;
                }
                .poi-detail-panel .btn-maps {
                    grid-column: auto;
                }
                .poi-detail-panel .panel-actions-grid .btn-secondary {
                    padding: 7px 6px;
                    font-size: 0.78rem;
                }

                /* Collapsed bottom-sheet: only the header stripe is visible.
                   Tapping anywhere on the strip (except ✕) re-expands the panel. */
                .poi-detail-panel--collapsed {
                    height: 3.5rem;
                    cursor: pointer;
                }

                /* Drag-handle indicator shown when the panel is collapsed */
                .poi-detail-panel--collapsed::before {
                    content: '';
                    position: absolute;
                    top: 7px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 36px;
                    height: 4px;
                    background: var(--border);
                    border-radius: 2px;
                    pointer-events: none;
                }
            }

            /* ── Help / Onboarding overlay ── */
            .help-panel {
                position: fixed;
                inset: 0;
                z-index: 1900;
                background: rgba(28, 25, 21, 0.55);
                display: none;
                align-items: center;
                justify-content: center;
                padding: 16px;
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
                padding-top: max(16px, env(safe-area-inset-top));
                box-sizing: border-box;
            }
            .help-panel.open {
                display: flex;
            }

            .help-scroll {
                position: relative;
                background: var(--bg);
                border-radius: var(--radius);
                box-shadow: var(--shadow-lg);
                width: 100%;
                max-width: 480px;
                max-height: calc(100dvh - 32px);
                overflow-y: auto;
                overflow-x: hidden;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }

            /* Sticky close button row — avoids float-induced horizontal overflow */
            .help-skip-row {
                position: sticky;
                top: 0;
                z-index: 2;
                display: flex;
                justify-content: flex-end;
                padding: 10px 12px 0;
                pointer-events: none;
            }
            .help-skip {
                pointer-events: auto;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-pill);
                color: var(--ink-muted);
                font-size: 0.8rem;
                cursor: pointer;
                padding: 4px 10px;
                line-height: 1.5;
            }
            .help-skip:hover {
                background: var(--surface-2);
                color: var(--ink);
            }

            /* Hero */
            .help-hero {
                padding: 36px 28px 24px;
                text-align: center;
                background: linear-gradient(160deg, var(--accent-strong) 0%, #3d4d34 100%);
                border-radius: var(--radius) var(--radius) 0 0;
                color: #fff;
            }
            .help-hero-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 64px;
                height: 64px;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 18px;
                margin-bottom: 16px;
            }
            .help-hero-icon svg {
                width: 38px;
                height: 38px;
                stroke: #fff;
            }
            .help-hero-title-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-bottom: 8px;
            }
            .help-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: #fff;
                margin: 0;
                line-height: 1.2;
            }
            .help-badge {
                display: inline-block;
                padding: 2px 8px;
                background: rgba(255, 255, 255, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.35);
                border-radius: var(--radius-pill);
                font-size: 0.7rem;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: #ffffffcc;
                vertical-align: middle;
            }
            .help-tagline {
                font-size: 0.95rem;
                color: rgba(255, 255, 255, 0.82);
                margin: 0;
                line-height: 1.45;
            }

            /* Sections */
            .help-section {
                padding: 22px 24px 4px;
            }
            .help-section-title {
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.09em;
                color: var(--ink-muted);
                margin: 0 0 14px;
            }

            /* Feature grid */
            .help-features {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-bottom: 16px;
            }
            .help-feature {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 7px;
                padding: 12px 8px;
                background: var(--surface);
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-sm);
                text-align: center;
            }
            .help-feature-icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                border-radius: 10px;
                flex-shrink: 0;
            }
            .help-feature-icon svg {
                width: 20px;
                height: 20px;
            }
            .help-feature-label {
                font-size: 0.75rem;
                font-weight: 500;
                color: var(--ink);
                line-height: 1.3;
            }

            /* Extra chips row */
            .help-extras {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
                margin-bottom: 8px;
            }
            .help-extra-chip {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 5px 10px;
                background: var(--surface);
                border: 1px solid var(--border-soft);
                border-radius: var(--radius-pill);
                font-size: 0.78rem;
                color: var(--ink-muted);
            }
            .help-extra-chip svg {
                width: 13px;
                height: 13px;
                flex-shrink: 0;
            }

            /* Login benefits */
            .help-section--login {
                background: var(--accent-soft);
                margin: 16px 16px 0;
                padding: 18px 18px 16px;
                border-radius: var(--radius-sm);
                border: 1px solid rgba(94, 107, 79, 0.2);
            }
            .help-login-header {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 12px;
            }
            .help-login-header svg {
                width: 16px;
                height: 16px;
                color: var(--accent);
                flex-shrink: 0;
            }
            .help-login-header .help-section-title {
                margin: 0;
                color: var(--accent-strong);
            }
            .help-login-list {
                list-style: none;
                margin: 0 0 10px;
                padding: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .help-login-list li {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                font-size: 0.875rem;
                color: var(--ink);
                line-height: 1.4;
            }
            .help-login-list li svg {
                width: 15px;
                height: 15px;
                flex-shrink: 0;
                margin-top: 2px;
                color: var(--accent);
            }
            .help-free-note {
                font-size: 0.78rem;
                color: var(--accent-strong);
                margin: 0;
                font-style: italic;
            }

            /* Beta notice */
            .help-beta-notice {
                display: flex;
                align-items: flex-start;
                gap: 9px;
                margin: 16px 16px 0;
                padding: 12px 14px;
                background: #fdf6e8;
                border: 1px solid #e8d8a8;
                border-radius: var(--radius-sm);
                font-size: 0.8rem;
                color: #7a5c1e;
                line-height: 1.4;
            }
            .help-beta-notice svg {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
                margin-top: 1px;
                stroke: #a07020;
            }

            /* CTA */
            .help-cta {
                padding: 20px 24px 24px;
                text-align: center;
            }
            .help-cta-btn {
                display: inline-block;
                padding: 13px 36px;
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: var(--radius-pill);
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(94, 107, 79, 0.35);
                transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
                width: 100%;
                max-width: 260px;
            }
            .help-cta-btn:hover {
                background: var(--accent-strong);
                box-shadow: 0 4px 14px rgba(94, 107, 79, 0.45);
            }
            .help-cta-btn:active {
                transform: scale(0.98);
            }

            @media (max-width: 500px) {
                .help-hero {
                    padding: 28px 20px 20px;
                }
                .help-section {
                    padding: 18px 16px 4px;
                }
                .help-section--login {
                    margin: 14px 12px 0;
                    padding: 16px;
                }
                .help-beta-notice {
                    margin: 14px 12px 0;
                }
                .help-cta {
                    padding: 16px 16px 20px;
                }
                .help-features {
                    grid-template-columns: repeat(3, 1fr);
                    gap: 8px;
                }
            }
        </style>
    </head>
    <body>
        <div id="topbar">
            <button id="btn-menu" type="button" title="Menü" aria-label="Menü">
                ☰
            </button>
            <h1>Stellplatz Finder</h1>
            <div id="search-bar"></div>
        </div>
        <div id="filter-panel">
            <div id="poi-filter"></div>
        </div>
        <div id="content">
            <div id="status"></div>
            <div id="map"></div>
            <div id="detail-panel"></div>
        </div>
        <script type="module" src="/src/client/app/main.ts"></script>
    </body>
</html>
