<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stellpatz Finder</title>
  <meta name="description" content="Parkplätze, Camper-Stellplätze und Campingplätze auf der Karte finden" />
  <meta name="theme-color" content="#4B5640" />
  <!-- iOS standalone / add-to-home-screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stellpatz" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <style>
    /* ── Design tokens: earthy / camper / clean ───────────────────────────── */
    :root {
      --bg: #F4F1EA;            /* warm paper */
      --surface: #FFFFFF;
      --surface-2: #ECE4D6;     /* sand */
      --border: #DCD2C0;
      --border-soft: #EAE3D6;
      --ink: #2C2822;
      --ink-muted: #6F665A;
      --ink-faint: #9A9082;
      --accent: #5E6B4F;        /* olive / forest */
      --accent-strong: #4B5640; /* topbar / dark surfaces */
      --accent-soft: #E6EADD;   /* active tints */
      --terracotta: #B5562F;    /* links + warm highlights */
      --danger: #A93B33;
      --danger-soft: #F4E2DD;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 999px;
      --shadow-sm: 0 1px 3px rgba(44, 40, 34, 0.12);
      --shadow: 0 4px 16px rgba(44, 40, 34, 0.16);
      --shadow-lg: 0 8px 28px rgba(44, 40, 34, 0.22);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      /* safe-area: clear the notch/status bar on installed iOS (black-translucent) */
      padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
      background: var(--accent-strong);
      color: #fff;
      z-index: 10;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    #topbar h1 {
      font-size: 1.02rem;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    /* ── Status toast ── */
    #status {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      max-width: 86%;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--accent-strong);
      text-align: center;
      box-shadow: var(--shadow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    #status.status-loading { display: block; }
    #status.status-error { display: block; background: var(--danger-soft); color: var(--danger); }

    /* ── Menu button ── */
    #btn-menu {
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 1.1rem;
      line-height: 1;
      padding: 7px 11px;
      cursor: pointer;
    }
    #btn-menu:hover { background: rgba(255, 255, 255, 0.32); }

    /* ── Side menu (drawer) ── */
    .side-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 21, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1500;
    }
    .side-menu-backdrop.open { opacity: 1; pointer-events: auto; }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(280px, 80vw);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 1600;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
    }
    .side-menu.open { transform: translateX(0); }

    .side-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--accent-strong);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
    }
    .side-menu-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
    .side-menu-close:hover { background: rgba(255, 255, 255, 0.2); }

    .side-menu-list { list-style: none; padding: 8px 0; }
    .side-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: none;
      background: none;
      cursor: pointer;
      padding: 13px 18px;
      font-size: 0.92rem;
      color: var(--ink);
      text-align: left;
    }
    .side-menu-item:hover { background: var(--surface-2); }
    .side-menu-icon { font-size: 1.15rem; line-height: 1; flex-shrink: 0; }

    /* ── Auth modal ── */
    .auth-backdrop {
      position: fixed; inset: 0;
      background: rgba(28, 25, 21, 0.45);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      z-index: 1700;
    }
    .auth-backdrop.open { opacity: 1; pointer-events: auto; }

    .auth-panel {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -48%) scale(0.98);
      width: min(360px, 92vw);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 1800;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .auth-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    .auth-body { padding: 22px 22px 24px; position: relative; }
    .auth-close {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: var(--ink-muted);
      border-radius: var(--radius-sm); padding: 2px 6px;
    }
    .auth-close:hover { background: var(--surface-2); }
    .auth-title { font-size: 1.1rem; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .auth-info { font-size: 0.85rem; color: var(--ink-muted); line-height: 1.45; margin-bottom: 14px; }
    .auth-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.9rem; color: var(--ink); background: var(--surface);
      outline: none; margin-bottom: 10px;
    }
    .auth-input:focus { border-color: var(--accent); }
    .auth-btn {
      width: 100%; padding: 11px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent);
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .auth-btn:hover { background: var(--accent-soft); }
    .auth-btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .auth-btn-primary:hover { background: var(--accent-strong); }
    .auth-btn:disabled { opacity: 0.6; cursor: default; }
    .auth-msg { font-size: 0.82rem; margin-top: 10px; color: var(--ink-muted); min-height: 1.2em; }
    .auth-msg-ok { color: var(--accent-strong); }
    .auth-msg-error { color: var(--danger); }

    /* ── Install hint (iOS add-to-home; surfaced later via Help) ── */
    .install-hint {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      background: var(--ink);
      color: #fff;
      font-size: 0.82rem;
      padding: 11px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    /* ── Search ── */
    #search-bar { flex: 1; position: relative; }
    .search-wrapper { position: relative; }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--ink);
      background: var(--surface);
      outline: none;
    }
    .search-input::placeholder { color: var(--ink-faint); }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      max-height: 240px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: var(--shadow);
      list-style: none;
    }
    .search-dropdown.hidden { display: none; }

    .search-dropdown-item {
      padding: 9px 13px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--ink);
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-dropdown-item:last-child { border-bottom: none; }
    .search-dropdown-item:hover { background: var(--surface-2); }

    /* ── Filter bar ── */
    #filter-panel {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 9;
    }

    #poi-filter { display: flex; gap: 7px; }

    .filter-btn {
      padding: 6px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      cursor: pointer;
      font-size: 1.15rem; /* icon-only — bigger emoji, no text label */
      line-height: 1;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); }

    .filter-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
    }

    /* ── Routing mode selector (dropdown) ── */
    #routing-mode {
      margin-left: auto; /* always pushed to the right edge, desktop + mobile */
      padding: 7px 11px;
      border: 1.5px solid var(--accent);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* ── Map + detail layout ── */
    #content { flex: 1; display: flex; overflow: hidden; position: relative; }
    #map { flex: 1; background: var(--surface-2); }

    /* ── Detail panel ── */
    #detail-panel { position: relative; }

    .poi-detail-panel {
      width: 340px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .poi-detail-panel.hidden { display: none; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.2px;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--ink-muted);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
    .btn-close:hover { background: var(--surface-2); }

    .btn-favorite {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--ink-faint);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      line-height: 1;
      transition: color 0.15s, transform 0.1s;
    }
    .btn-favorite:hover { color: var(--terracotta); }
    .btn-favorite.active { color: var(--terracotta); }
    .btn-favorite.active:active { transform: scale(0.85); }

    .route-summary {
      padding: 11px 18px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--border-soft);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: var(--ink);
    }
    .detour { color: var(--ink-muted); }

    .poi-tags {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      flex: 1;
    }
    .poi-tags th, .poi-tags td {
      padding: 8px 18px;
      text-align: left;
      border-bottom: 1px solid var(--border-soft);
    }
    .poi-tags th { color: var(--ink-muted); font-weight: 500; width: 40%; }
    .poi-tags td { color: var(--ink); }
    .poi-tags a { color: var(--terracotta); }

    .panel-actions {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      border-top: 1px solid var(--border-soft);
    }

    .btn-primary {
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }
    .btn-primary:hover { background: var(--accent-strong); }

    .btn-secondary {
      padding: 10px;
      background: var(--surface);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-secondary:hover { background: var(--accent-soft); }

    /* ── Opening hours badge ── */
    .oh-badge {
      padding: 6px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      border-bottom: 1px solid transparent;
    }
    .oh-open { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--border-soft); }
    .oh-closed { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-soft); }

    /* ── Nearby amenities ── */
    .nearby-heading {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 12px 18px 4px;
    }
    .nearby-list { list-style: none; padding: 0 18px 10px; border-bottom: 1px solid var(--border-soft); }
    .nearby-item { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: 0.83rem; }
    .nearby-icon { flex-shrink: 0; font-size: 1rem; }
    .nearby-name { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nearby-dist { flex-shrink: 0; color: var(--ink-faint); font-size: 0.78rem; }

    /* ── Image strip ── */
    .poi-img-strip {
      display: flex;
      gap: 7px;
      padding: 12px 18px;
      overflow-x: auto;
      scrollbar-width: thin;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-soft);
    }
    .poi-img-item { flex-shrink: 0; border-radius: var(--radius-sm); overflow: hidden; position: relative; display: block; }
    .poi-img-thumb { height: 110px; width: auto; display: block; object-fit: cover; }
    .poi-img-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(44, 40, 34, 0.6);
      color: #fff; font-size: 0.68rem; padding: 2px 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Notes section ── */
    .poi-notes { padding: 0 18px 14px; border-top: 1px solid var(--border-soft); }
    .notes-loading { font-size: 0.78rem; color: var(--ink-faint); font-style: italic; padding: 10px 0 0; }
    .notes-heading {
      font-size: 0.72rem; font-weight: 700; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 6px;
    }
    .note-item {
      background: #FBF4E4;
      border: 1px solid #E6D6B0;
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      margin-bottom: 6px;
    }
    .note-text { font-size: 0.82rem; color: var(--ink); line-height: 1.45; }
    .note-meta { font-size: 0.72rem; color: var(--ink-faint); margin-top: 3px; }
    .note-text a { color: var(--terracotta); word-break: break-all; }
    .note-img { display: block; max-height: 100px; max-width: 100%; border-radius: var(--radius-sm); margin-top: 5px; object-fit: cover; }

    /* ── Lightbox ── */
    #poi-lightbox { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; }
    #poi-lightbox.hidden { display: none; }
    .lightbox-backdrop { position: absolute; inset: 0; background: rgba(28, 25, 21, 0.9); }
    .lightbox-close {
      position: absolute; top: 14px; right: 14px; z-index: 1;
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .lightbox-close:hover { background: rgba(255, 255, 255, 0.32); }
    .lightbox-img {
      position: relative; z-index: 1;
      max-width: 92vw; max-height: 88vh;
      border-radius: var(--radius); object-fit: contain;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 600px) {
      /* Filter bar wraps instead of overflowing — every control stays reachable. */
      #filter-panel { flex-wrap: wrap; gap: 7px; padding: 8px; }
      #poi-filter { flex-wrap: wrap; }

      /* fixed (not absolute): the #detail-panel host collapses to 0 width on
         mobile because its only child is out of flow — anchor to the viewport.
         z-index must beat Leaflet's panes/controls (root stacking context). */
      .poi-detail-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 60dvh;
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0;
        box-shadow: 0 -4px 16px rgba(44, 40, 34, 0.18);
        z-index: 1100;
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <button id="btn-menu" type="button" title="Menü" aria-label="Menü">☰</button>
    <h1>🅿️ Stellpatz Finder</h1>
    <div id="search-bar"></div>
  </div>
  <div id="filter-panel">
    <div id="poi-filter"></div>
    <select id="routing-mode" aria-label="Routenmodus" title="Routenmodus">
      <option value="driving" title="Auto">🚗</option>
      <option value="cycling" title="Fahrrad">🚲</option>
      <option value="foot" title="Fußweg">🚶</option>
    </select>
  </div>
  <div id="content">
    <div id="status"></div>
    <div id="map"></div>
    <div id="detail-panel"></div>
  </div>
  <script type="module" src="/src/client/app/main.ts"></script>
</body>
</html>
