        <style>
            /* ── Design tokens: earthy / camper / clean ───────────────────────────── */
            :root {
                --bg: #f4f1ea; /* warm paper */
                --surface: #ffffff;
                --surface-2: #ece4d6; /* sand */
                --border: #dcd2c0;
                --border-soft: #eae3d6;
                --ink: #2c2822;
                --ink-muted: #6f665a;
                --ink-faint: #9a9082;
                --accent: #5e6b4f; /* olive / forest */
                --accent-strong: #4b5640; /* topbar / dark surfaces */
                --accent-soft: #e6eadd; /* active tints */
                --terracotta: #b5562f; /* links + warm highlights */
                --danger: #a93b33;
                --danger-soft: #f4e2dd;
                --radius: 12px;
                --radius-sm: 8px;
                --radius-pill: 999px;
                --shadow-sm: 0 1px 3px rgba(44, 40, 34, 0.12);
                --shadow: 0 4px 16px rgba(44, 40, 34, 0.16);
                --shadow-lg: 0 8px 28px rgba(44, 40, 34, 0.22);
                --font:
                    -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "Helvetica Neue", sans-serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                height: 100vh;
            }

            body {
                font-family: var(--font);
                color: var(--ink);
                display: flex;
                flex-direction: column;
                height: 100%;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                background: var(--bg);
                -webkit-font-smoothing: antialiased;
            }

            /* ── Top bar ── */
            #topbar {
                display: flex;
                align-items: center;
                gap: 10px;
                /* safe-area: clear the notch/status bar on installed iOS (black-translucent) */
                padding: calc(10px + env(safe-area-inset-top))
                    calc(14px + env(safe-area-inset-right)) 10px
                    calc(14px + env(safe-area-inset-left));
                background: var(--accent-strong);
                color: #fff;
                z-index: 10;
                flex-shrink: 0;
                box-shadow: var(--shadow-sm);
            }

            #topbar h1 {
                font-size: 1.02rem;
                font-weight: 600;
                white-space: nowrap;
                letter-spacing: 0.2px;
            }

            /* ── Map + detail layout ── */
            #content {
                flex: 1;
                min-height: 0;
                position: relative;
            }
            /* The map always fills the viewport. Topbar and filter-panel overlay
               on top — hiding them never resizes the map container, so no jump. */
            #map {
                position: fixed;
                inset: 0;
                background: var(--surface-2);
                z-index: 0;
            }
        </style>
    </head>

        <div id="content">

                <button id="float-filters" type="button" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="9" x2="17" y1="12" y2="12"/><line x1="12" x2="17" y1="18" y2="18"/></svg></button>
