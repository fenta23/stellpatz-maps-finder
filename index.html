<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Stellplatz Finder</title>
        <meta
            name="description"
            content="Parkplätze, Camper-Stellplätze und Campingplätze auf der Karte finden"
        />
        <meta name="theme-color" content="#4B5640" />
        <!-- iOS standalone / add-to-home-screen -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Stellplatz" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
        <style>
            /* ── Design tokens: earthy / camper / clean ───────────────────────────── */
            :root {
                --bg: #f4f1ea; /* warm paper */
                --surface: #ffffff;
                --surface-2: #ece4d6; /* sand */
                --border: #dcd2c0;
                --border-soft: #eae3d6;
                --ink: #2c2822;
                --ink-muted: #6f665a;
                --ink-faint: #9a9082;
                --accent: #5e6b4f; /* olive / forest */
                --accent-strong: #4b5640; /* topbar / dark surfaces */
                --accent-soft: #e6eadd; /* active tints */
                --terracotta: #b5562f; /* links + warm highlights */
                --danger: #a93b33;
                --danger-soft: #f4e2dd;
                --radius: 12px;
                --radius-sm: 8px;
                --radius-pill: 999px;
                --shadow-sm: 0 1px 3px rgba(44, 40, 34, 0.12);
                --shadow: 0 4px 16px rgba(44, 40, 34, 0.16);
                --shadow-lg: 0 8px 28px rgba(44, 40, 34, 0.22);
                --font:
                    -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "Helvetica Neue", sans-serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                height: 100vh;
            }

            body {
                font-family: var(--font);
                color: var(--ink);
                display: flex;
                flex-direction: column;
                height: 100%;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                background: var(--bg);
                -webkit-font-smoothing: antialiased;
            }

            /* ── Top bar ── */
            #topbar {
                display: flex;
                align-items: center;
                gap: 10px;
                /* safe-area: clear the notch/status bar on installed iOS (black-translucent) */
                padding: calc(10px + env(safe-area-inset-top))
                    calc(14px + env(safe-area-inset-right)) 10px
                    calc(14px + env(safe-area-inset-left));
                background: var(--accent-strong);
                color: #fff;
                z-index: 10;
                flex-shrink: 0;
                box-shadow: var(--shadow-sm);
            }

            #topbar h1 {
                font-size: 1.02rem;
                font-weight: 600;
                white-space: nowrap;
                letter-spacing: 0.2px;
            }

            /* ── Status toast ── */
            #status {
                display: none;
                position: absolute;
                top: 12px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
                max-width: 86%;
                font-size: 0.78rem;
                font-weight: 500;
                padding: 6px 16px;
                border-radius: var(--radius-pill);
                background: var(--surface);
                color: var(--accent-strong);
                text-align: center;
                box-shadow: var(--shadow);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                pointer-events: none;
            }
            #status.status-loading {
                display: block;
            }
            #status.status-error {
                display: block;
                background: var(--danger-soft);
                color: var(--danger);
            }

            /* ── Menu button ── */
            #btn-menu {
                flex-shrink: 0;
                border: none;
                border-radius: var(--radius-sm);
                background: rgba(255, 255, 255, 0.18);
                color: #fff;
                font-size: 1.1rem;
                line-height: 1;
                padding: 7px 11px;
                cursor: pointer;
            }
            #btn-menu:hover {
                background: rgba(255, 255, 255, 0.32);
            }

            /* ── Side menu (drawer) ── */
            .side-menu-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(28, 25, 21, 0.4);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 1500;
            }
            .side-menu-backdrop.open {
                opacity: 1;
                pointer-events: auto;
            }

            .side-menu {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: min(280px, 80vw);
                background: var(--surface);
                box-shadow: var(--shadow-lg);
                transform: translateX(-100%);
                transition: transform 0.2s ease;
                z-index: 1600;
                display: flex;
                flex-direction: column;
                padding-top: env(safe-area-inset-top);
                padding-left: env(safe-area-inset-left);
            }
            .side-menu.open {
                transform: translateX(0);
            }

            .side-menu-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 18px;
                background: var(--accent-strong);
                color: #fff;
                font-weight: 600;
                font-size: 1rem;
            }
            .side-menu-title {
                display: flex;
                align-items: center;
                gap: 2px;
            }
            .side-menu-close {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.1rem;
                cursor: pointer;
                padding: 2px 6px;
                border-radius: var(--radius-sm);
            }
            .side-menu-close:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            .side-menu-list {
                list-style: none;
                padding: 8px 0;
            }
            .side-menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                border: none;
                background: none;
                cursor: pointer;
                padding: 13px 18px;
                font-size: 0.92rem;
                color: var(--ink);
                text-align: left;
            }
            .side-menu-item:hover {
                background: var(--surface-2);
            }
            .side-menu-icon {
                font-size: 1.15rem;
                line-height: 1;
                flex-shrink: 0;
            }

            /* ── Auth modal ── */
            .auth-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(28, 25, 21, 0.45);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 1700;
            }
            .auth-backdrop.open {
                opacity: 1;
                pointer-events: auto;
            }

            .auth-panel {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -48%) scale(0.98);
                width: min(360px, 92vw);
                background: var(--surface);
                border-radius: var(--radius);
                box-shadow: var(--shadow-lg);
                z-index: 1800;
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 0.2s,
                    transform 0.2s;
            }
            .auth-panel.open {
                opacity: 1;
                pointer-events: auto;
                transform: translate(-50%, -50%) scale(1);
            }

            .auth-body {
                padding: 22px 22px 24px;
                position: relative;
            }
            .auth-close {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 1;
                background: none;
                border: none;
                cursor: pointer;
                font-size: 1.1rem;
                color: var(--ink-muted);
                border-radius: var(--radius-sm);
                padding: 8px;
                line-height: 1;
            }
            .auth-close:hover {
                background: var(--surface-2);
            }
            .auth-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--ink);
                margin-bottom: 8px;
            }
            .auth-info {
                font-size: 0.85rem;
                color: var(--ink-muted);
                line-height: 1.45;
                margin-bottom: 14px;
            }
            .auth-input {
                width: 100%;
                padding: 10px 12px;
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: 16px;
                color: var(--ink);
                background: var(--surface);
                outline: none;
                margin-bottom: 10px;
            }
            .auth-input:focus {
                border-color: var(--accent);
            }
            .auth-btn {
                width: 100%;
                padding: 11px;
                border-radius: var(--radius-sm);
                border: 1.5px solid var(--accent);
                background: var(--surface);
                color: var(--accent);
                font-size: 0.9rem;
                font-weight: 600;
                cursor: pointer;
            }
            .auth-btn:hover {
                background: var(--accent-soft);
            }
            .auth-btn-primary {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            .auth-btn-primary:hover {
                background: var(--accent-strong);
            }
            .auth-btn:disabled {
                opacity: 0.6;
                cursor: default;
            }
            .auth-btn-text {
                border-color: transparent;
                background: transparent;
                font-weight: 500;
                margin-top: 8px;
            }
            .auth-btn-text:hover {
                background: transparent;
                text-decoration: underline;
            }
            .auth-msg {
                font-size: 0.82rem;
                margin-top: 10px;
                color: var(--ink-muted);
                min-height: 1.2em;
            }
            .auth-msg-ok {
                color: var(--accent-strong);
            }
            .auth-msg-error {
                color: var(--danger);
            }

            /* Profile overview */
            .profile {
                margin: 4px 0 18px;
            }
            .profile-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding: 9px 0;
                border-bottom: 1px solid var(--border-soft);
                font-size: 0.9rem;
            }
            .profile-row dt {
                color: var(--ink-muted);
            }
            .profile-row dd {
                color: var(--ink);
                font-weight: 600;
            }

            /* ── Favorites list overlay ── */
            .fav-panel {
                position: fixed;
                inset: 0;
                z-index: 1650;
                background: var(--bg);
                display: none;
                flex-direction: column;
                padding-top: env(safe-area-inset-top);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-bottom: env(safe-area-inset-bottom);
            }
            .fav-panel.open {
                display: flex;
            }

            .fav-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 18px;
                background: var(--accent-strong);
                color: #fff;
                font-weight: 600;
                font-size: 1.05rem;
                flex-shrink: 0;
            }
            .fav-close {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.2rem;
                cursor: pointer;
                padding: 2px 8px;
                border-radius: var(--radius-sm);
            }
            .fav-close:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            .fav-list {
                list-style: none;
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
                margin: 0;
            }
            .fav-empty {
                padding: 40px 28px;
                text-align: center;
                color: var(--ink-muted);
                font-size: 0.9rem;
                line-height: 1.5;
            }

            /* ── Info panel (reuses .fav-panel header/close) ── */
            .info-body {
                flex: 1;
                overflow-y: auto;
                padding: 20px 22px 32px;
                line-height: 1.6;
                font-size: 0.9rem;
                color: var(--ink);
            }
            .info-body a {
                color: var(--accent);
            }
            .info-body a:hover {
                text-decoration: underline;
            }
            .info-section {
                margin-bottom: 24px;
            }
            .info-app-name {
                font-size: 1.2rem;
                font-weight: 700;
                margin: 0 0 4px;
                color: var(--ink);
            }
            .info-version {
                color: var(--ink-muted);
                margin: 0 0 10px;
                font-size: 0.85rem;
            }
            .info-desc {
                margin: 0 0 8px;
            }
            .info-links {
                margin: 0;
                font-size: 0.85rem;
                color: var(--ink-muted);
            }
            .info-section h3 {
                font-size: 1rem;
                font-weight: 700;
                margin: 0 0 10px;
                color: var(--ink);
            }
            .info-changelog h4 {
                font-size: 0.95rem;
                font-weight: 700;
                margin: 16px 0 6px;
                color: var(--ink);
            }
            .info-changelog h4:first-child {
                margin-top: 0;
            }
            .info-changelog h5 {
                font-size: 0.85rem;
                font-weight: 600;
                margin: 8px 0 4px;
                color: var(--ink-muted);
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            .info-changelog ul {
                margin: 0 0 8px;
                padding-left: 18px;
                list-style: disc;
            }
            .info-changelog li {
                margin-bottom: 3px;
                line-height: 1.5;
            }
            .info-legal-list {
                margin: 4px 0 10px;
                padding-left: 18px;
                list-style: disc;
            }
            .info-legal-list li {
                margin-bottom: 3px;
            }
            .info-section p {
                margin: 0 0 8px;
            }

            .fav-item {
                display: flex;
                align-items: stretch;
                border-bottom: 1px solid var(--border-soft);
            }
            .fav-item-main {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 14px;
                border: none;
                background: none;
                cursor: pointer;
                padding: 14px 18px;
                text-align: left;
                color: var(--ink);
                min-width: 0;
            }
            .fav-item-main:hover {
                background: var(--surface-2);
            }
            .fav-item-icon {
                display: inline-flex;
                align-items: center;
                flex-shrink: 0;
            }
            .fav-item-icon svg {
                width: 24px;
                height: 24px;
                display: block;
            }
            .fav-item-text {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .fav-item-name {
                font-size: 0.95rem;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .fav-item-sub {
                font-size: 0.78rem;
                color: var(--ink-muted);
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .fav-item-remove {
                border: none;
                background: none;
                cursor: pointer;
                font-size: 1.05rem;
                padding: 0 18px;
                color: var(--ink-faint);
            }
            .fav-item-remove:hover {
                background: var(--danger-soft);
            }

            .fav-footer {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 12px;
                flex-shrink: 0;
                border-top: 1px solid var(--border-soft);
                background: var(--surface);
            }
            .fav-footer:empty {
                display: none;
            }
            .fav-page-btn {
                border: 1.5px solid var(--border);
                background: var(--surface);
                color: var(--accent);
                border-radius: var(--radius-sm);
                font-size: 1rem;
                line-height: 1;
                padding: 7px 14px;
                cursor: pointer;
            }
            .fav-page-btn:hover:not(:disabled) {
                background: var(--accent-soft);
            }
            .fav-page-btn:disabled {
                opacity: 0.4;
                cursor: default;
            }
            .fav-page-status {
                font-size: 0.85rem;
                color: var(--ink-muted);
            }

            /* ── Install hint (iOS add-to-home; surfaced later via Help) ── */
            .install-hint {
                position: fixed;
                left: 50%;
                bottom: calc(16px + env(safe-area-inset-bottom));
                transform: translateX(-50%);
                z-index: 1200;
                max-width: 90%;
                background: var(--ink);
                color: #fff;
                font-size: 0.82rem;
                padding: 11px 16px;
                border-radius: var(--radius);
                box-shadow: var(--shadow-lg);
                text-align: center;
            }

            /* ── Search ── */
            #search-bar {
                flex: 1;
                position: relative;
            }
            .search-wrapper {
                position: relative;
            }
            .search-form {
                margin: 0;
                display: block;
                position: relative;
            }

            .search-input {
                width: 100%;
                padding: 8px 68px 8px 12px;
                border: none;
                border-radius: var(--radius-sm);
                font-size: 16px;
                color: var(--ink);
                background: var(--surface);
                outline: none;
            }
            .search-input::placeholder {
                color: var(--ink-faint);
            }
            /* Hide the browser's native search-cancel "x" — we have our own .search-clear button. */
            .search-input::-webkit-search-cancel-button {
                -webkit-appearance: none;
                appearance: none;
            }

            .search-clear {
                position: absolute;
                right: 34px;
                top: 50%;
                transform: translateY(-50%);
                border: none;
                background: none;
                cursor: pointer;
                padding: 4px;
                color: var(--ink-faint);
                line-height: 1;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .search-clear svg {
                width: 18px;
                height: 18px;
                display: block;
            }
            .search-clear:hover {
                color: var(--ink-muted);
            }

            /* "✨ KI-Suche" trigger — always visible at the right edge. */
            .search-ai {
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                border: none;
                background: none;
                cursor: pointer;
                padding: 4px;
                color: var(--accent);
                line-height: 1;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .search-ai svg {
                width: 19px;
                height: 19px;
                display: block;
            }
            .search-ai:hover {
                color: var(--accent-strong);
            }

            /* ── KI-Suche Chat-Modal ── */
            .ai-modal-overlay {
                position: fixed;
                inset: 0;
                z-index: 4000;
                background: rgba(0, 0, 0, 0.4);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
            }
            .ai-modal-overlay.hidden {
                display: none;
            }
            .ai-modal {
                width: min(460px, 94vw);
                max-height: 82vh;
                display: flex;
                flex-direction: column;
                background: var(--surface);
                border-radius: 14px;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
                overflow: hidden;
            }
            .ai-modal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 14px 10px;
                border-bottom: 1px solid var(--border-soft);
            }
            .ai-modal-title {
                display: flex;
                align-items: center;
                gap: 7px;
                margin: 0;
                font-size: 0.98rem;
                font-weight: 700;
                color: var(--ink);
            }
            .ai-modal-spark {
                width: 17px;
                height: 17px;
                color: var(--accent);
            }
            .ai-modal-close {
                border: none;
                background: none;
                cursor: pointer;
                color: var(--ink-faint);
                padding: 4px;
                display: flex;
            }
            .ai-modal-close svg {
                width: 18px;
                height: 18px;
            }
            .ai-modal-close:hover {
                color: var(--ink-muted);
            }
            .ai-modal-messages {
                flex: 1;
                min-height: 160px;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 9px;
            }
            .ai-bubble {
                max-width: 85%;
                padding: 8px 12px;
                border-radius: 14px;
                font-size: 0.88rem;
                line-height: 1.45;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .ai-bubble--user {
                align-self: flex-end;
                background: var(--accent);
                color: #fff;
                border-bottom-right-radius: 4px;
            }
            .ai-bubble--assistant {
                align-self: flex-start;
                background: var(--surface-2);
                color: var(--ink);
                border-bottom-left-radius: 4px;
            }
            .ai-bubble--muted {
                color: var(--ink-muted);
                font-style: italic;
            }
            .ai-bubble--typing {
                color: var(--ink-faint);
                letter-spacing: 2px;
            }
            .ai-result-card {
                align-self: stretch;
                margin-top: 2px;
                padding: 12px;
                border: 1.5px solid var(--accent);
                border-radius: 12px;
                background: var(--accent-soft, var(--surface-2));
                display: flex;
                flex-direction: column;
                gap: 9px;
            }
            .ai-result-recap {
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--ink);
            }
            .ai-result-apply {
                border: none;
                background: var(--accent);
                color: #fff;
                border-radius: var(--radius-sm);
                font-size: 0.88rem;
                font-weight: 600;
                padding: 9px 14px;
                cursor: pointer;
            }
            .ai-result-apply:hover {
                background: var(--accent-strong);
            }
            .ai-modal-form {
                display: flex;
                gap: 8px;
                padding: 12px 14px;
                border-top: 1px solid var(--border-soft);
            }
            .ai-modal-input {
                flex: 1;
                padding: 9px 12px;
                font-size: 16px;
                font-family: inherit;
                color: var(--ink);
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                outline: none;
            }
            .ai-modal-input:focus {
                border-color: var(--accent);
            }
            .ai-modal-input:disabled {
                opacity: 0.6;
            }
            .ai-modal-send {
                border: none;
                background: var(--accent);
                color: #fff;
                border-radius: var(--radius-sm);
                padding: 0 13px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .ai-modal-send svg {
                width: 18px;
                height: 18px;
            }
            .ai-modal-send:hover {
                background: var(--accent-strong);
            }

            .search-dropdown {
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                right: 0;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                max-height: 240px;
                overflow-y: auto;
                z-index: 1000;
                box-shadow: var(--shadow);
                list-style: none;
            }
            .search-dropdown.hidden {
                display: none;
            }

            .hidden {
                display: none;
            }

            .search-dropdown-item {
                padding: 9px 13px;
                cursor: pointer;
                font-size: 0.82rem;
                color: var(--ink);
                border-bottom: 1px solid var(--border-soft);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .search-dropdown-item:last-child {
                border-bottom: none;
            }
            .search-dropdown-item:hover {
                background: var(--surface-2);
            }

            /* ── Filter bar ── */
            #filter-panel {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 8px 14px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
                z-index: 9;
            }

            #poi-filter {
                display: flex;
                align-items: center;
                gap: 7px;
                flex: 1;
                min-width: 0;
                position: relative;
            }

            /* The chip row absorbs the leftover width and clips overflow; chips
               that don't fit are moved into the "…" menu by FilterPanel. */
            .filter-chips {
                display: flex;
                align-items: center;
                gap: 7px;
                flex: 1 1 auto;
                min-width: 0;
                overflow: hidden;
            }

            .filter-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 6px;
                border: 1.5px solid var(--border);
                border-radius: var(--radius-pill);
                background: var(--surface);
                cursor: pointer;
                line-height: 1;
                transition: all 0.15s;
            }
            .filter-btn svg {
                width: 22px;
                height: 22px;
                display: block;
            }
            .filter-btn {
                color: var(--ink-muted);
            }
            .filter-btn:hover {
                border-color: var(--accent);
            }

            .filter-btn.active {
                border-color: var(--chip-color, var(--accent));
                background: var(--accent-soft);
                color: var(--chip-color, var(--accent));
            }

            .filter-add,
            .filter-config {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--accent);
            }
            .filter-add:hover,
            .filter-config:hover {
                background: var(--accent);
                color: #fff;
            }

            /* "…" overflow toggle — sits at the end of the chip row. */
            .filter-more {
                flex: 0 0 auto;
            }
            .filter-more.active {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--accent);
            }

            /* Dropdown listing the chips that didn't fit on the row. */
            .filter-more-menu {
                position: absolute;
                top: calc(100% + 6px);
                right: 0;
                min-width: 180px;
                max-height: min(60vh, 360px);
                overflow-y: auto;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow);
                padding: 6px;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .filter-more-menu.hidden {
                display: none;
            }
            .filter-more-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 10px;
                border: none;
                border-radius: var(--radius-sm);
                background: none;
                cursor: pointer;
                font-size: 0.85rem;
                color: var(--ink);
                text-align: left;
                width: 100%;
            }
            .filter-more-item:hover {
                background: var(--surface-2);
            }
            .filter-more-icon {
                display: inline-flex;
                flex: 0 0 auto;
                color: var(--ink-muted);
            }
            .filter-more-icon svg {
                width: 20px;
                height: 20px;
                display: block;
            }
            .filter-more-item.active .filter-more-icon {
                color: var(--chip-color, var(--accent));
            }
            .filter-more-item.active .filter-more-label {
                font-weight: 600;
                color: var(--chip-color, var(--accent));
            }

            /* ── Filter configuration panel (reuses .fav-panel shell) ── */
            .fc-body {
                flex: 1;
                overflow-y: auto;
                padding: 14px 16px 28px;
                -webkit-overflow-scrolling: touch;
            }
            .fc-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
                max-width: 640px;
                margin: 0 auto;
            }
            .fc-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow-sm);
            }
            .fc-swatch {
                flex-shrink: 0;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: #fff;
            }
            .fc-swatch svg {
                width: 20px;
                height: 20px;
                stroke: #fff;
            }
            .fc-name {
                flex: 1;
                min-width: 0;
                font-weight: 600;
                color: var(--ink);
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .fc-badge {
                font-size: 0.62rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-weight: 700;
                color: var(--terracotta);
                background: var(--danger-soft);
                padding: 2px 7px;
                border-radius: var(--radius-pill);
            }
            /* iOS-style toggle */
            .fc-switch {
                position: relative;
                width: 42px;
                height: 24px;
                flex-shrink: 0;
                cursor: pointer;
            }
            .fc-switch input {
                position: absolute;
                opacity: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                cursor: pointer;
            }
            .fc-slider {
                position: absolute;
                inset: 0;
                background: var(--border);
                border-radius: var(--radius-pill);
                transition: background 0.15s;
            }
            .fc-slider::before {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 20px;
                height: 20px;
                background: #fff;
                border-radius: 50%;
                box-shadow: var(--shadow-sm);
                transition: transform 0.15s;
            }
            .fc-switch input:checked + .fc-slider {
                background: var(--accent);
            }
            .fc-switch input:checked + .fc-slider::before {
                transform: translateX(18px);
            }
            .fc-icon-btn {
                flex-shrink: 0;
                width: 34px;
                height: 34px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: none;
                background: none;
                color: var(--ink-muted);
                border-radius: var(--radius-sm);
                cursor: pointer;
            }
            .fc-icon-btn svg {
                width: 19px;
                height: 19px;
            }
            .fc-icon-btn:hover {
                background: var(--surface-2);
                color: var(--accent);
            }
            .fc-icon-btn.fc-danger:hover {
                color: var(--danger);
                background: var(--danger-soft);
            }
            .fc-add-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin: 16px auto 0;
                max-width: 640px;
                width: 100%;
                padding: 12px;
                border: 1.5px dashed var(--accent);
                border-radius: var(--radius);
                background: var(--accent-soft);
                color: var(--accent-strong);
                font-weight: 600;
                cursor: pointer;
            }
            .fc-add-btn svg {
                width: 18px;
                height: 18px;
            }
            .fc-add-btn:hover {
                background: var(--accent);
                color: #fff;
            }

            /* Editor */
            .fc-editor {
                max-width: 640px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .fc-editor-title {
                font-size: 1.15rem;
                color: var(--accent-strong);
                margin: 4px 0 0;
            }
            .fc-field {
                display: flex;
                flex-direction: column;
                gap: 7px;
            }
            .fc-field > label {
                font-size: 0.78rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--ink-muted);
            }
            .fc-input {
                font-size: 16px;
                padding: 10px 12px;
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                background: var(--surface);
                color: var(--ink);
                width: 100%;
            }
            .fc-input:focus {
                outline: none;
                border-color: var(--accent);
            }
            .fc-templates {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
                gap: 8px;
            }
            .fc-template {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 9px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                background: var(--surface);
                cursor: pointer;
                font-size: 0.85rem;
                color: var(--ink);
                text-align: left;
            }
            .fc-template .fc-swatch {
                width: 26px;
                height: 26px;
            }
            .fc-template .fc-swatch svg {
                width: 15px;
                height: 15px;
            }
            .fc-template:hover {
                border-color: var(--accent);
                background: var(--accent-soft);
            }
            .fc-appearance {
                display: flex;
                align-items: flex-start;
                gap: 14px;
            }
            .fc-grow {
                flex: 1;
                min-width: 0;
            }
            .fc-preview {
                width: 46px;
                height: 46px;
                flex-shrink: 0;
                margin-top: 22px;
            }
            .fc-preview svg {
                width: 26px;
                height: 26px;
            }
            .fc-icon-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
                gap: 6px;
                max-height: 132px;
                overflow-y: auto;
                padding: 2px;
            }
            .fc-icon-opt {
                aspect-ratio: 1;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                background: var(--surface);
                color: var(--ink-muted);
                cursor: pointer;
            }
            .fc-icon-opt svg {
                width: 20px;
                height: 20px;
            }
            .fc-icon-opt:hover {
                border-color: var(--accent);
            }
            .fc-icon-opt.selected {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--accent-strong);
            }
            .fc-colors {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .fc-color {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 2px solid transparent;
                cursor: pointer;
                box-shadow: var(--shadow-sm);
            }
            .fc-color.selected {
                border-color: var(--ink);
                box-shadow:
                    0 0 0 2px var(--surface),
                    0 0 0 4px var(--ink);
            }
            .fc-kinds {
                display: flex;
                gap: 14px;
                flex-wrap: wrap;
            }
            .fc-kind {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-size: 0.9rem;
                color: var(--ink);
                cursor: pointer;
            }
            .fc-tags {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .fc-tag-row {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .fc-tag-row .fc-input {
                flex: 1;
                min-width: 0;
            }
            .fc-op {
                flex-shrink: 0;
                width: 34px;
                height: 38px;
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                background: var(--surface-2);
                color: var(--accent-strong);
                font-size: 1.1rem;
                font-weight: 700;
                cursor: pointer;
            }
            .fc-add-row {
                align-self: flex-start;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 7px 12px;
                border: 1px solid var(--border);
                border-radius: var(--radius-pill);
                background: var(--surface);
                color: var(--accent-strong);
                font-weight: 600;
                font-size: 0.85rem;
                cursor: pointer;
            }
            .fc-add-row svg {
                width: 15px;
                height: 15px;
            }
            .fc-add-row:hover {
                border-color: var(--accent);
                background: var(--accent-soft);
            }
            .fc-note {
                font-size: 0.85rem;
                color: var(--ink-muted);
                background: var(--surface-2);
                padding: 10px 12px;
                border-radius: var(--radius-sm);
            }
            .fc-error {
                color: var(--danger);
                background: var(--danger-soft);
                padding: 9px 12px;
                border-radius: var(--radius-sm);
                font-size: 0.85rem;
                margin: 0;
            }
            .fc-actions {
                display: flex;
                gap: 10px;
                justify-content: flex-end;
                padding-top: 4px;
            }
            .fc-btn {
                padding: 10px 20px;
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                background: var(--surface);
                color: var(--ink);
                font-weight: 600;
                cursor: pointer;
            }
            .fc-btn:hover {
                border-color: var(--accent);
            }
            .fc-btn-primary {
                background: var(--accent-strong);
                border-color: var(--accent-strong);
                color: #fff;
            }
            .fc-btn-primary:hover {
                background: var(--accent);
                border-color: var(--accent);
            }

            .filter-sep {
                width: 1.5px;
                background: var(--border);
                margin: 4px 2px;
                border-radius: 1px;
                flex-shrink: 0;
            }

            .filter-custom {
                color: #ff8f00;
            }
            .filter-custom.active {
                border-color: #ff8f00;
                background: #fff3e0;
            }

            /* ── Import panel (reuses .fav-panel shell) ── */
            .import-body {
                flex: 1;
                overflow-y: auto;
                padding: 18px 20px 28px;
                -webkit-overflow-scrolling: touch;
            }
            .import-intro {
                margin: 0 0 22px;
                font-size: 0.9rem;
                color: var(--ink-muted);
                line-height: 1.55;
            }
            .import-intro a {
                color: var(--accent);
            }
            .import-variant {
                background: var(--surface-2);
                border-radius: var(--radius-sm);
                padding: 16px 18px;
                margin-bottom: 14px;
            }
            .import-variant-header {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                font-size: 0.95rem;
                margin-bottom: 8px;
                color: var(--ink);
            }
            .import-variant-header svg {
                width: 20px;
                height: 20px;
                flex-shrink: 0;
                color: var(--accent);
            }
            .import-variant p {
                margin: 0 0 6px;
                font-size: 0.85rem;
                color: var(--ink-muted);
                line-height: 1.5;
            }
            .import-path {
                font-size: 0.78rem !important;
                color: var(--ink-muted);
                word-break: break-all;
            }
            .import-path code {
                background: var(--surface);
                padding: 2px 6px;
                border-radius: var(--radius-sm);
                font-size: 0.75rem;
            }
            .import-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-top: 10px;
                padding: 10px 18px;
                border: 1.5px solid var(--accent);
                border-radius: var(--radius-sm);
                background: var(--accent);
                color: #fff;
                font-weight: 600;
                font-size: 0.9rem;
                cursor: pointer;
                transition: background 0.15s;
            }
            .import-btn:hover {
                background: var(--accent-strong);
            }
            .import-btn svg {
                width: 16px;
                height: 16px;
            }

            /* ── Routing mode toggle ── */
            /* ── Map actions (locate + routing, combined horizontal control) ── */
            .map-actions {
                display: flex;
                align-items: center;
                background: var(--surface);
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow-sm);
                overflow: hidden;
            }
            .map-actions .locate-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 34px;
                height: 34px;
                border: none;
                cursor: pointer;
                background: transparent;
                color: var(--ink-muted);
                transition:
                    background 0.15s,
                    color 0.15s;
                flex-shrink: 0;
            }
            .map-actions .locate-btn:hover {
                background: var(--surface-2);
                color: var(--accent);
            }
            .map-actions .locate-btn svg {
                width: 20px;
                height: 20px;
                display: block;
            }
            .map-actions-sep {
                width: 1px;
                height: 24px;
                border-left: 1.5px solid var(--accent);
                flex-shrink: 0;
            }
            .map-actions .routing-toggle {
                display: flex;
            }
            .map-actions .routing-opt {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: none;
                background: transparent;
                color: var(--accent);
                cursor: pointer;
                padding: 5px 7px;
                line-height: 1;
                transition: background 0.15s;
            }
            .map-actions .routing-opt + .routing-opt {
                border-left: 1.5px solid var(--accent);
            }
            .map-actions .routing-opt:hover {
                background: var(--accent-soft);
            }
            .map-actions .routing-opt.active {
                background: var(--accent);
                color: #fff;
            }
            .map-actions .routing-opt svg {
                width: 18px;
                height: 18px;
                display: block;
            }

            /* ── Map controls: one consistent look for zoom, layer switcher & locate.
       Zoom selectors are #map-scoped to outrank Leaflet's own (later-injected) CSS. ── */
            .layer-switcher {
                display: flex;
                flex-direction: column;
                gap: 1px;
                background: transparent;
            }

            .layer-btn,
            #map .leaflet-bar a.leaflet-control-zoom-in,
            #map .leaflet-bar a.leaflet-control-zoom-out {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 34px;
                height: 34px;
                border: none;
                cursor: pointer;
                background: #fff;
                color: var(--ink-muted);
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .layer-btn:hover,
            #map .leaflet-bar a.leaflet-control-zoom-in:hover,
            #map .leaflet-bar a.leaflet-control-zoom-out:hover {
                background: var(--surface-2);
                color: var(--accent);
            }

            /* More spacing between bottom-left controls and attribution */
            .leaflet-bottom .leaflet-control {
                margin-bottom: 20px;
            }

            .layer-btn svg,
            #map .leaflet-bar a.leaflet-control-zoom-in svg,
            #map .leaflet-bar a.leaflet-control-zoom-out svg {
                width: 20px;
                height: 20px;
                display: block;
            }

            .layer-btn:first-child {
                border-radius: 4px 4px 0 0;
            }
            .layer-btn:last-child {
                border-radius: 0 0 4px 4px;
            }
            .layer-btn.active {
                background: var(--accent-soft);
                color: var(--accent);
            }

            /* Hairline between + / − (matches the layer switcher's 1px gap look). */
            #map .leaflet-bar a.leaflet-control-zoom-in {
                border-bottom: 1px solid var(--border-soft);
            }
            /* Disabled zoom (at min/max) stays neutral, no hover tint. */
            #map .leaflet-bar a.leaflet-disabled,
            #map .leaflet-bar a.leaflet-disabled:hover {
                color: var(--ink-faint);
                background: #fff;
                cursor: default;
            }

            /* ── Placement mode (adding custom POI) ── */
            .placing-poi,
            .placing-poi * {
                cursor: crosshair !important;
            }

            /* ── Custom POI Editor modal ── */
            .custom-poi-editor {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 1900;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                overflow-y: auto;
                padding: 20px;
                background: rgba(44, 40, 34, 0.45);
            }
            .custom-poi-editor .editor-scroll {
                background: #fff;
                border-radius: 12px;
                max-width: 520px;
                width: 100%;
                padding: 24px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
                position: relative;
                margin: auto;
            }
            .custom-poi-editor h2 {
                font-size: 1.2rem;
                margin: 0 0 16px;
                color: var(--ink);
            }
            .custom-poi-editor fieldset {
                border: none;
                padding: 0;
                margin: 0 0 16px;
            }
            .custom-poi-editor legend {
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--ink-muted);
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .editor-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-bottom: 10px;
            }
            .editor-row {
                display: flex;
                gap: 10px;
            }
            .editor-field--grow {
                flex: 1;
            }
            .editor-field--narrow {
                flex: 0 0 100px;
            }
            .field-label {
                font-size: 0.8rem;
                color: var(--ink-muted);
            }
            .field-required {
                color: var(--accent);
            }
            .custom-poi-editor input,
            .custom-poi-editor textarea {
                padding: 8px 10px;
                border: 1.5px solid var(--border);
                border-radius: 8px;
                font-size: 0.95rem;
                font-family: inherit;
                color: var(--ink);
                background: var(--surface);
                transition: border-color 0.15s;
            }
            .custom-poi-editor input:focus,
            .custom-poi-editor textarea:focus {
                outline: none;
                border-color: var(--accent);
            }
            .custom-poi-editor textarea {
                resize: vertical;
                min-height: 60px;
            }
            .editor-position {
                font-size: 0.8rem;
                color: var(--ink-muted);
                margin-bottom: 16px;
                background: var(--surface);
                padding: 8px 12px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .editor-position-label {
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-size: 0.75rem;
                color: var(--ink-muted);
            }
            .editor-position-coords {
                font-family: "SF Mono", "Menlo", "Consolas", monospace;
                color: var(--ink);
                font-size: 0.85rem;
            }
            .editor-actions {
                display: flex;
                gap: 10px;
                justify-content: flex-end;
                margin-top: 16px;
            }
            .editor-error {
                color: var(--accent);
                font-size: 0.85rem;
                margin: 0 0 12px;
            }

            .editor-primary {
                margin-bottom: 6px;
            }
            .editor-columns {
                display: grid;
                grid-template-columns: 1fr;
                gap: 0 24px;
                align-items: stretch;
            }
            .editor-col {
                display: flex;
                flex-direction: column;
            }
            /* The right column's last section + its textarea grow to absorb any height
       difference, so both columns bottom-align cleanly instead of leaving a hole. */
            .editor-section--grow {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            .editor-field--grow-area {
                flex: 1;
            }
            .editor-field--grow-area textarea {
                flex: 1;
                height: 100%;
            }
            @media (min-width: 640px) {
                .custom-poi-editor .editor-scroll {
                    max-width: 900px;
                }
                .editor-columns {
                    grid-template-columns: 1fr 1fr;
                }
                .editor-col .editor-section:last-child {
                    margin-bottom: 0;
                }
            }
            /* Mobile: full-screen sheet covering the detail view, no floating card. */
            @media (max-width: 639px) {
                .custom-poi-editor {
                    padding: 0;
                }
                .custom-poi-editor .editor-scroll {
                    border-radius: 0;
                    max-width: none;
                    width: 100%;
                    min-height: 100%;
                    margin: 0;
                    padding: 16px;
                    box-shadow: none;
                }
            }

            /* Icon picker grid */
            .icon-picker {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
                gap: 6px;
                max-height: 200px;
                overflow-y: auto;
                padding: 4px;
                border: 1.5px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
            }
            .icon-opt {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border: 2px solid transparent;
                border-radius: 8px;
                background: none;
                cursor: pointer;
                padding: 4px;
                transition: all 0.15s;
            }
            .icon-opt svg {
                width: 24px;
                height: 24px;
                color: var(--ink);
            }
            .icon-opt:hover {
                border-color: var(--accent-soft);
                background: var(--surface-2);
            }
            .icon-opt.selected {
                border-color: #ff8f00;
                background: #fff3e0;
            }
            .icon-opt.selected svg {
                color: #ff8f00;
            }

            .btn-cancel {
                padding: 8px 20px;
                border-radius: 8px;
                border: 1.5px solid var(--border);
                background: var(--surface);
                cursor: pointer;
                font-size: 0.95rem;
                color: var(--ink-muted);
                transition: all 0.15s;
            }
            .btn-cancel:hover {
                border-color: var(--ink-muted);
            }

            /* ── Map + detail layout ── */
            #content {
                flex: 1;
                min-height: 0;
                position: relative;
                overflow: hidden;
            }
            /* Own stacking context below the topbar (z-index 10) so Leaflet's marker/
        control panes can't render above the topbar's search dropdown. */
            #map {
                position: absolute;
                inset: 0;
                background: var(--surface-2);
                z-index: 0;
            }

            /* ── Detail panel ── */
            #detail-panel {
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                width: 340px;
                z-index: 1;
                /* Host spans the right strip even while empty — let clicks fall
                   through to the map controls (layer switcher) underneath it.
                   The visible panel re-enables pointer events for itself. */
                pointer-events: none;
            }

            .poi-detail-panel {
                width: 340px;
                height: 100%;
                background: var(--surface);
                border-left: 1px solid var(--border);
                overflow: hidden;
                display: flex;
                flex-direction: column;
                transition: transform 0.2s, height 0.25s ease;
                pointer-events: auto;
            }
            .poi-detail-panel.hidden {
                display: none;
            }

            /* Panel = header (fixed) + scrollable middle + docked action footer. */
            .poi-detail-content {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            .poi-detail-scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            .panel-header {
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 16px 18px 12px;
                border-bottom: 1px solid var(--border-soft);
            }

            .panel-header h2 {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 1.05rem;
                font-weight: 700;
                color: var(--ink);
                letter-spacing: 0.2px;
            }

            .btn-close {
                background: none;
                border: none;
                font-size: 1.1rem;
                cursor: pointer;
                color: var(--ink-muted);
                padding: 2px 6px;
                border-radius: var(--radius-sm);
            }
            .btn-close:hover {
                background: var(--surface-2);
            }

            .btn-favorite {
                background: none;
                border: none;
                cursor: pointer;
                color: var(--ink-faint);
                padding: 2px 6px;
                border-radius: var(--radius-sm);
                line-height: 1;
                transition:
                    color 0.15s,
                    transform 0.1s;
                display: inline-flex;
            }
            .btn-favorite svg {
                width: 22px;
                height: 22px;
                display: block;
            }
            .btn-favorite:hover {
                color: var(--terracotta);
            }
            .btn-favorite.active {
                color: var(--terracotta);
            }
            .btn-favorite.active svg {
                fill: currentColor;
            }
            .btn-favorite.active:active {
                transform: scale(0.85);
            }

            /* ── Header overflow (⋮) menu: POI-specific actions (edit / delete) ── */
            .poi-menu-wrap {
                position: relative;
                display: inline-flex;
            }
            .btn-kebab {
                background: none;
                border: none;
                cursor: pointer;
                color: var(--ink-muted);
                padding: 2px 6px;
                border-radius: var(--radius-sm);
                line-height: 1;
                display: inline-flex;
            }
            .btn-kebab svg {
                width: 20px;
                height: 20px;
                display: block;
            }
            .btn-kebab:hover {
                background: var(--surface-2);
                color: var(--ink);
            }
            .poi-menu {
                position: absolute;
                top: calc(100% + 4px);
                right: 0;
                min-width: 168px;
                padding: 5px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow-lg);
                z-index: 20;
            }
            .poi-menu-item {
                display: flex;
                align-items: center;
                gap: 9px;
                width: 100%;
                border: none;
                background: none;
                cursor: pointer;
                padding: 9px 10px;
                border-radius: 6px;
                font-size: 0.88rem;
                color: var(--ink);
                text-align: left;
            }
            .poi-menu-item svg {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
            }
            .poi-menu-item:hover {
                background: var(--surface-2);
            }
            .poi-menu-item--danger {
                color: #e53935;
            }
            .poi-menu-item--danger:hover {
                background: #ffebee;
            }

            .route-summary {
                padding: 11px 18px;
                background: var(--accent-soft);
                border-bottom: 1px solid var(--border-soft);
                font-size: 0.85rem;
                display: flex;
                flex-direction: column;
                gap: 2px;
                color: var(--ink);
            }
            .route-summary svg {
                width: 1em;
                height: 1em;
                vertical-align: middle;
            }
            .detour {
                color: var(--ink-muted);
            }

            .route-start {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                padding: 7px 18px;
                font-size: 0.8rem;
                color: var(--ink-muted);
                border-bottom: 1px solid var(--border-soft);
                background: var(--surface);
            }
            .route-start strong {
                color: var(--ink);
                font-weight: 600;
            }
            .route-start-reset {
                border: none;
                background: none;
                cursor: pointer;
                padding: 0;
                color: var(--terracotta);
                font-size: 0.8rem;
                text-decoration: underline;
            }
            .btn-go svg,
            .btn-set-start svg {
                width: 1em;
                height: 1em;
                vertical-align: middle;
            }

            .poi-tags {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.85rem;
                flex: 1;
            }
            .poi-tags th,
            .poi-tags td {
                padding: 8px 18px;
                text-align: left;
                border-bottom: 1px solid var(--border-soft);
            }
            .poi-tags th {
                color: var(--ink-muted);
                font-weight: 500;
                width: 40%;
            }
            .poi-tags td {
                color: var(--ink);
            }
            .poi-tags a {
                color: var(--terracotta);
            }

            .panel-actions {
                flex-shrink: 0;
                padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
                display: flex;
                flex-direction: column;
                gap: 8px;
                border-top: 1px solid var(--border-soft);
                background: var(--surface);
                box-shadow: 0 -3px 10px rgba(44, 40, 34, 0.06);
            }

            .btn-primary {
                padding: 11px;
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: var(--radius-sm);
                cursor: pointer;
                font-size: 0.9rem;
                font-weight: 600;
                text-align: center;
            }
            .btn-primary:hover {
                background: var(--accent-strong);
            }

            .btn-secondary {
                padding: 10px;
                background: var(--surface);
                color: var(--accent);
                border: 1.5px solid var(--accent);
                border-radius: var(--radius-sm);
                font-size: 0.9rem;
                text-align: center;
                text-decoration: none;
                display: block;
            }
            .btn-secondary:hover {
                background: var(--accent-soft);
            }

            /* Compact 2-column grid for the secondary actions (the panel grew a lot). */
            .panel-actions-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .panel-actions-grid .btn-secondary {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                padding: 9px 8px;
                font-size: 0.82rem;
                white-space: nowrap;
                margin: 0;
                min-width: 0;
            }
            .panel-actions-grid .btn-secondary svg {
                width: 15px;
                height: 15px;
                margin: 0;
                flex-shrink: 0;
            }
            .panel-actions-grid .btn-secondary[hidden] {
                display: none;
            }
            /* Maps link spans the full width on its own row. */
            .btn-maps {
                grid-column: 1 / -1;
            }

            .btn-delete {
                border-color: #e53935;
                color: #e53935;
            }
            .btn-delete:hover {
                background: #ffebee;
            }

            /* ── Opening hours badge ── */
            .oh-badge {
                padding: 6px 18px;
                font-size: 0.8rem;
                font-weight: 600;
                border-bottom: 1px solid transparent;
            }
            .oh-open {
                background: var(--accent-soft);
                color: var(--accent-strong);
                border-color: var(--border-soft);
            }
            .oh-closed {
                background: var(--danger-soft);
                color: var(--danger);
                border-color: var(--danger-soft);
            }

            /* ── Nearby amenities ── */
            .nearby-heading {
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--ink-muted);
                text-transform: uppercase;
                letter-spacing: 0.6px;
                padding: 12px 18px 4px;
            }
            .nearby-hint {
                font-weight: 500;
                text-transform: none;
                letter-spacing: 0;
                color: var(--ink-faint);
            }
            .nearby-list {
                list-style: none;
                padding: 0 12px 10px;
                border-bottom: 1px solid var(--border-soft);
            }
            .nearby-item {
                display: flex;
                align-items: center;
                gap: 7px;
                width: 100%;
                padding: 6px 6px;
                font-size: 0.83rem;
                border: none;
                background: none;
                cursor: pointer;
                text-align: left;
                border-radius: var(--radius-sm);
                color: inherit;
            }
            .nearby-item:hover {
                background: var(--surface-2);
            }
            .nearby-item.active {
                background: var(--accent-soft);
            }
            .nearby-item.active .nearby-name {
                color: var(--accent-strong);
                font-weight: 600;
            }
            .nearby-icon {
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
            }
            .nearby-icon svg {
                width: 20px;
                height: 20px;
                display: block;
            }
            .nearby-name {
                flex: 1;
                color: var(--ink);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .nearby-dist {
                flex-shrink: 0;
                color: var(--ink-faint);
                font-size: 0.78rem;
            }

            /* ── Image strip ── */
            .poi-img-strip {
                display: flex;
                gap: 7px;
                padding: 12px 18px;
                overflow-x: auto;
                scrollbar-width: thin;
                background: var(--surface-2);
                border-bottom: 1px solid var(--border-soft);
            }
            .poi-img-item {
                flex-shrink: 0;
                border-radius: var(--radius-sm);
                overflow: hidden;
                position: relative;
                display: block;
            }
            .poi-img-thumb {
                height: 110px;
                width: auto;
                display: block;
                object-fit: cover;
            }
            .poi-img-caption {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(44, 40, 34, 0.6);
                color: #fff;
                font-size: 0.68rem;
                padding: 2px 6px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* ── My personal note (editor) ── */
            .poi-mynote {
                padding: 12px 18px 14px;
                border-top: 1px solid var(--border-soft);
            }
            .mynote-heading {
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--ink-muted);
                text-transform: uppercase;
                letter-spacing: 0.6px;
                margin: 0 0 8px;
            }
            .mynote-input {
                width: 100%;
                resize: vertical;
                min-height: 56px;
                padding: 9px 11px;
                font-size: 0.88rem;
                font-family: inherit;
                color: var(--ink);
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                outline: none;
            }
            .mynote-input:focus {
                border-color: var(--accent);
            }
            .mynote-row {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 8px;
            }
            .mynote-save {
                border: 1.5px solid var(--accent);
                background: var(--accent);
                color: #fff;
                border-radius: var(--radius-sm);
                font-size: 0.82rem;
                font-weight: 600;
                padding: 7px 16px;
                cursor: pointer;
            }
            .mynote-save:hover {
                background: var(--accent-strong);
                border-color: var(--accent-strong);
            }
            .mynote-status {
                font-size: 0.78rem;
                color: var(--accent-strong);
            }

            /* ── KI summary (Phase 1 sidecar) ── */
            .poi-ai-summary {
                padding: 12px 18px 14px;
                border-top: 1px solid var(--border-soft);
            }
            .ai-summary-heading {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--ink-muted);
                text-transform: uppercase;
                letter-spacing: 0.6px;
                margin: 0 0 6px;
            }
            .ai-summary-heading svg {
                width: 14px;
                height: 14px;
                color: var(--accent);
            }
            .ai-summary-text {
                margin: 0;
                font-size: 0.88rem;
                line-height: 1.5;
                color: var(--ink);
            }
            .ai-summary-loading {
                margin: 0;
                font-size: 0.8rem;
                font-style: italic;
                color: var(--ink-faint);
            }

            /* ── Notes section (community OSM notes) ── */
            .poi-notes {
                padding: 0 18px 14px;
