<div class="auth-state">
  <h2 class="auth-title">Anmelden</h2>
  <button class="auth-btn auth-btn-oauth" type="button" data-ref="google">
    <span class="auth-oauth-icon" aria-hidden="true">G</span> Mit Google anmelden
  </button>
  <div class="auth-divider"><span>oder per E-Mail</span></div>

  <div data-ref="stepEmail">
    <p class="auth-info">Wir senden dir einen 6-stelligen Code — kein Passwort nötig.</p>
    <input class="auth-input" type="email" placeholder="deine@email.de" autocomplete="email" data-ref="input" />
    <button class="auth-btn auth-btn-primary" type="button" data-ref="send">Code senden</button>
  </div>

  <div data-ref="stepCode" hidden>
    <p class="auth-info">Code aus der E-Mail eingeben:</p>
    <input class="auth-input" type="text" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="123456" data-ref="code" />
    <button class="auth-btn auth-btn-primary" type="button" data-ref="verify">Anmelden</button>
    <button class="auth-btn auth-btn-text" type="button" data-ref="back">Andere E-Mail</button>
  </div>

  <p class="auth-msg" data-ref="msg"></p>
</div>
