<div class="auth-state">
  <h2 class="auth-title">Anmelden</h2>
  <button class="auth-btn auth-btn-oauth" type="button" data-ref="google">
    <span class="auth-oauth-icon" aria-hidden="true">G</span> Mit Google anmelden
  </button>
  <div class="auth-divider"><span>oder per E-Mail</span></div>
  <p class="auth-info">Wir senden dir einen Magic-Link — kein Passwort nötig.</p>
  <input class="auth-input" type="email" placeholder="deine@email.de" autocomplete="email" data-ref="input" />
  <button class="auth-btn auth-btn-primary" type="button" data-ref="send">Magic-Link senden</button>
  <p class="auth-msg" data-ref="msg"></p>
</div>
