services:
  - type: web
    name: stellpatz-finder
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAPILLARY_ACCESS_TOKEN
        sync: false   # In Render Dashboard manuell setzen
      - key: SUPABASE_URL
        sync: false   # optional — persistenter POI-Cache
      - key: SUPABASE_SERVICE_KEY
        sync: false   # service_role key, nur serverseitig
      - key: VITE_SUPABASE_URL
        sync: false   # Client-Login (Build-Zeit), = Project URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false   # Client-Login (Build-Zeit), anon key (öffentlich)
