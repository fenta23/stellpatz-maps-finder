<!--
  Supabase → Authentication → Email Templates → "Magic Link"
  Betreff: Dein Login-Link – Stellpatz Finder
-->
<div style="font-family:-apple-system,Segoe UI,sans-serif;max-width:480px;margin:0 auto;color:#2C2822">
  <h2 style="color:#4B5640;margin:0 0 12px">🅿️ Stellpatz Finder</h2>
  <p style="font-size:15px;line-height:1.5">Klicke zum Anmelden — kein Passwort nötig.</p>
  <p style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}" style="background:#4B5640;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600;display:inline-block">Jetzt anmelden</a>
  </p>
  <p style="font-size:13px;color:#6F665A;line-height:1.5">Oder diesen Link kopieren:<br><a href="{{ .ConfirmationURL }}" style="color:#B5562F;word-break:break-all">{{ .ConfirmationURL }}</a></p>
  <p style="font-size:12px;color:#9A9082;margin-top:24px">Der Link ist ca. 1 Stunde gültig. Nicht du? Mail ignorieren.</p>
</div>
