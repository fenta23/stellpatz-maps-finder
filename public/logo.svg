<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- carve a bite out of the disc to make a crescent moon -->
    <mask id="crescent">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="372" cy="150" r="40" fill="#000"/>
    </mask>
  </defs>

  <!-- brand background (full bleed for maskable) -->
  <rect width="512" height="512" rx="104" fill="#4B5640"/>

  <!-- night sky: crescent moon + stars (overnighter theme) -->
  <circle cx="392" cy="146" r="40" fill="#FFD54F" mask="url(#crescent)"/>
  <g fill="#FFFFFF">
    <circle cx="120" cy="124" r="5"/>
    <circle cx="158" cy="96" r="3.5"/>
    <circle cx="96" cy="172" r="3"/>
  </g>

  <!-- ground -->
  <rect x="80" y="372" width="352" height="10" rx="5" fill="#FFFFFF" opacity="0.45"/>

  <!-- camper van -->
  <g>
    <!-- pop-top roof -->
    <rect x="118" y="206" width="180" height="44" rx="16" fill="#FFFFFF"/>
    <!-- main body -->
    <rect x="92" y="236" width="328" height="120" rx="28" fill="#FFFFFF"/>
    <!-- windows -->
    <rect x="124" y="258" width="78" height="48" rx="10" fill="#37474F"/>
    <rect x="216" y="258" width="62" height="48" rx="10" fill="#37474F"/>
    <!-- sliding-door seam -->
    <rect x="304" y="252" width="6" height="92" rx="3" fill="#37474F" opacity="0.35"/>
    <!-- headlight -->
    <rect x="396" y="300" width="18" height="22" rx="6" fill="#FFD54F"/>
    <!-- accent stripe -->
    <rect x="92" y="320" width="328" height="16" fill="#E65100"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="172" cy="360" r="34" fill="#263238"/>
    <circle cx="172" cy="360" r="13" fill="#FFFFFF"/>
    <circle cx="344" cy="360" r="34" fill="#263238"/>
    <circle cx="344" cy="360" r="13" fill="#FFFFFF"/>
  </g>
</svg>
