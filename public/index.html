<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellpatz Maps Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: #f5f5f5;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1565C0;
      color: #fff;
      z-index: 10;
      flex-shrink: 0;
    }

    #topbar h1 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
    }

    #search-bar {
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    /* ── Filter bar ── */
    #filter-panel {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
      z-index: 9;
    }

    .filter-btn {
      padding: 5px 12px;
      border: 2px solid #ccc;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .filter-btn.active {
      border-color: #1565C0;
      background: #E3F2FD;
      color: #1565C0;
      font-weight: 600;
    }

    /* ── Map + detail layout ── */
    #content {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    #map {
      flex: 1;
    }

    /* ── Detail panel ── */
    #detail-panel {
      position: relative;
    }

    .poi-detail-panel {
      width: 320px;
      height: 100%;
      background: #fff;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .poi-detail-panel.hidden {
      display: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eee;
    }

    .panel-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #666;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-close:hover { background: #f0f0f0; }

    .route-summary {
      padding: 10px 16px;
      background: #E8F5E9;
      border-bottom: 1px solid #C8E6C9;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detour { color: #666; }

    .poi-tags {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      flex: 1;
    }

    .poi-tags th, .poi-tags td {
      padding: 7px 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }

    .poi-tags th { color: #666; font-weight: 500; width: 40%; }
    .poi-tags a { color: #1565C0; }

    .panel-actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #eee;
    }

    .btn-primary {
      padding: 10px;
      background: #1565C0;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .btn-primary:hover { background: #1976D2; }

    .btn-secondary {
      padding: 9px;
      background: #fff;
      color: #1565C0;
      border: 2px solid #1565C0;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .btn-secondary:hover { background: #E3F2FD; }

    @media (max-width: 600px) {
      .poi-detail-panel {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 60%;
        border-left: none;
        border-top: 1px solid #ddd;
        z-index: 20;
      }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>🅿️ Stellpatz Finder</h1>
    <div id="search-bar"></div>
  </div>
  <div id="filter-panel"></div>
  <div id="content">
    <div id="map"></div>
    <div id="detail-panel"></div>
  </div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
